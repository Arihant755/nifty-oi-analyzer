name: Nifty 50 Hourly OI Cloud Scraper

on:
  schedule:
    # 09:15 IST (03:45 UTC) - Market Open Stance
    - cron: '45 3 * * 1-5'
    # 10:15 IST (04:45 UTC) - Hour 1 Checkpoint
    - cron: '45 4 * * 1-5'
    # 11:15 IST (05:45 UTC) - Hour 2 Checkpoint
    - cron: '45 5 * * 1-5'
    # 12:15 IST (06:45 UTC) - Hour 3 Midday Checkpoint
    - cron: '45 6 * * 1-5'
    # 13:15 IST (07:45 UTC) - Hour 4 Afternoon Checkpoint
    - cron: '45 7 * * 1-5'
    # 14:15 IST (08:45 UTC) - Hour 5 Pre-Breakout Checkpoint
    - cron: '45 8 * * 1-5'
    # 15:15 IST (09:45 UTC) - Hour 6 Pre-Close Checkpoint
    - cron: '45 9 * * 1-5'
    # 15:30 IST (10:00 UTC) - Market Close Final Wrap
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution even on holidays/weekends'
        required: false
        default: false
        type: boolean

jobs:
  collect-hourly-oi:
    name: Scrape & Store to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scraper/cloud_runner.py --force
          else
            python scraper/cloud_runner.py
          fi

